name: Build Cyber Hub Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          set -e
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools

          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Make scripts executable
        run: chmod +x tools/*.py || true

      - name: Fetch JARs
        run: |
          python3 tools/dependencies.py
          ls app/libs/ | wc -l

      - name: Create keystore
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/development-signing.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/src/main/assets/development-signing.p12 \
              -storetype PKCS12 \
              -storepass cyberhub-development \
              -alias cyberhub-dev \
              -keypass cyberhub-development \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CyberHub Development, O=CyberHub, C=US"
          fi

      - name: Build with forced modern ECJ + full error capture
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk

          # Force a modern ECJ that works with Java 17
          mkdir -p .build
          curl -fsSL -o .build/ecj-modern.jar https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar

          # Patch build.py temporarily to use the modern ECJ and print errors
          python3 - << 'EOF'
          from pathlib import Path
          p = Path("tools/build.py")
          text = p.read_text()

          # Force modern ECJ
          text = text.replace(
              "ecj=ROOT/'toolchain/ecj.jar'\nif not ecj.exists():\n ecj=B/'ecj.jar'\n if not ecj.exists():urllib.request.urlretrieve('https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.37.0/ecj-3.37.0.jar',ecj)",
              "ecj=Path('.build/ecj-modern.jar')"
          )

          # Make the run function print stderr on failure
          old_run = '''def run(cmd):\n print('Running',Path(cmd[0]).name,' '.join(str(x) for x in cmd[1:3]),flush=True)\n subprocess.run(list(map(str,cmd)),check=True,cwd=P,env=e)'''

          new_run = '''def run(cmd):\n print('Running',Path(cmd[0]).name,' '.join(str(x) for x in cmd[1:3]),flush=True)\n r=subprocess.run(list(map(str,cmd)),cwd=P,env=e,capture_output=True,text=True)\n if r.returncode != 0:\n  print("=== STDOUT ===")\n  print(r.stdout)\n  print("=== STDERR ===")\n  print(r.stderr)\n  raise subprocess.CalledProcessError(r.returncode, cmd)\n'''

          text = text.replace(old_run, new_run)
          p.write_text(text)
          print("Patched build.py to use modern ECJ and show full errors")
          EOF

          python3 tools/build.py --sdk "$ANDROID_HOME" --tools "$ANDROID_HOME/build-tools/34.0.0"

      - name: Verify APK
        run: |
          if [ ! -f dist/Cyber-Hub-Manager-0.1.6.apk ]; then
            echo "APK not found"
            find . -name "*.apk" -ls || true
            exit 1
          fi
          ls -lh dist/Cyber-Hub-Manager-0.1.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Hub-Manager-0.1.6
          path: dist/Cyber-Hub-Manager-0.1.6.apk
          if-no-files-found: error
          retention-days: 30
