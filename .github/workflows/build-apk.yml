name: Build Cyber Hub Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android command-line tools (manual & reliable)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          ls -la $ANDROID_HOME/platforms/
          ls -la $ANDROID_HOME/build-tools/

      - name: Make scripts executable
        run: |
          chmod +x gradlew || true
          chmod +x tools/*.py || true

      - name: Fetch runtime JARs and native libs
        run: python3 tools/dependencies.py

      - name: Create development signing keystore
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/development-signing.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/src/main/assets/development-signing.p12 \
              -storetype PKCS12 \
              -storepass cyberhub-development \
              -alias cyberhub-dev \
              -keypass cyberhub-development \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CyberHub Development, OU=Dev, O=CyberHub, L=City, ST=State, C=US"
          fi

      - name: Build APK with project builder
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/android-34/"
          ls "$ANDROID_HOME/build-tools/34.0.0/"
          python3 tools/build.py --sdk "$ANDROID_HOME" --tools "$ANDROID_HOME/build-tools/34.0.0"

      - name: List output
        run: |
          ls -lh dist/ || true
          find . -name "*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Hub-Manager-0.1.6
          path: |
            dist/Cyber-Hub-Manager-0.1.6.apk
            dist/*.apk
          if-no-files-found: error
          retention-days: 30
