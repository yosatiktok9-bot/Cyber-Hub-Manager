name: Build Cyber Hub Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "=== Platforms ==="
          ls -la $ANDROID_HOME/platforms/ || true
          echo "=== Build-tools ==="
          ls -la $ANDROID_HOME/build-tools/ || true

      - name: Make scripts executable
        run: |
          chmod +x gradlew || true
          chmod +x tools/*.py || true

      - name: Fetch runtime JARs and native libs
        run: python3 tools/dependencies.py

      - name: Create development signing keystore
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/development-signing.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/src/main/assets/development-signing.p12 \
              -storetype PKCS12 \
              -storepass cyberhub-development \
              -alias cyberhub-dev \
              -keypass cyberhub-development \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CyberHub Development, OU=Dev, O=CyberHub, L=City, ST=State, C=US"
          fi

      - name: Build APK with project builder
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/android-34/" || echo "platform missing"
          ls "$ANDROID_HOME/build-tools/" || echo "build-tools missing"
          python3 tools/build.py --sdk "$ANDROID_HOME" --tools "$ANDROID_HOME/build-tools/34.0.0"

      - name: List output
        run: |
          ls -lh dist/ || true
          find . -name "*.apk" -ls || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Hub-Manager-0.1.6
          path: |
            dist/Cyber-Hub-Manager-0.1.6.apk
            dist/*.apk
          if-no-files-found: error
          retention-days: 30
