name: Build Cyber Hub Manager APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK (fully manual + verified)
        run: |
          set -e
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools

          # Download official command-line tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Accept licenses non-interactively
          yes | sdkmanager --licenses > /dev/null || true

          # Install required packages
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

          # Verify installation
          echo "=== Verifying Android SDK ==="
          ls -la $ANDROID_HOME/platforms/android-34/
          ls -la $ANDROID_HOME/build-tools/34.0.0/

          # Export for later steps
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Make scripts executable
        run: |
          chmod +x tools/*.py || true
          chmod +x gradlew || true

      - name: Fetch all runtime JARs and native libraries
        run: |
          python3 tools/dependencies.py
          echo "=== JARs fetched ==="
          ls -lh app/libs/ | head -20

      - name: Create development signing keystore
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/development-signing.p12 ]; then
            keytool -genkeypair -v \
              -keystore app/src/main/assets/development-signing.p12 \
              -storetype PKCS12 \
              -storepass cyberhub-development \
              -alias cyberhub-dev \
              -keypass cyberhub-development \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CyberHub Development, OU=Dev, O=CyberHub, L=City, ST=State, C=US"
          fi
          ls -la app/src/main/assets/development-signing.p12

      - name: Build APK with project builder
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=== Platform check ==="
          ls "$ANDROID_HOME/platforms/android-34/android.jar"
          echo "=== Build-tools check ==="
          ls "$ANDROID_HOME/build-tools/34.0.0/"

          python3 tools/build.py --sdk "$ANDROID_HOME" --tools "$ANDROID_HOME/build-tools/34.0.0"

      - name: Verify and list APK
        run: |
          echo "=== Looking for APK ==="
          ls -lh dist/ || true
          find . -name "*.apk" -type f -ls || true

          if [ ! -f dist/Cyber-Hub-Manager-0.1.6.apk ]; then
            echo "ERROR: APK was not produced"
            exit 1
          fi

          echo "SUCCESS: APK built"
          ls -lh dist/Cyber-Hub-Manager-0.1.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Hub-Manager-0.1.6
          path: dist/Cyber-Hub-Manager-0.1.6.apk
          if-no-files-found: error
          retention-days: 30
